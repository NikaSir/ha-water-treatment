<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Водоподготовка — тестовый предпросмотр</title>
<style>
  :root{--primary-background-color:#101820;--card-background-color:#1b2733;--ha-card-background:#1b2733;--secondary-background-color:#14202b;--primary-text-color:#f1f5f8;--secondary-text-color:#afc1d1;--divider-color:#334653;--primary-color:#52b2ed;color-scheme:dark}
  html[data-theme=light]{--primary-background-color:#f4f7fa;--card-background-color:#fff;--ha-card-background:#fff;--secondary-background-color:#f2f5f8;--primary-text-color:#20242a;--secondary-text-color:#5d6878;--divider-color:#dce4ed;--primary-color:#1688f8;color-scheme:light}
  html,body{height:100%;margin:0;overflow:hidden}nikas-water-treatment-panel{display:block;height:100%}
  ha-icon{display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}
</style>
<script src="/preview/ha-icon.js"></script>
<script src="/custom_components/water_treatment/frontend/water-treatment-panel.js"></script>
<body>
<script type="module">
  import {overviewFixture, emptyOverviewFixture} from '/tests/overview_fixtures.mjs';
  const query = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = query.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const snapshot = query.get('state') === 'unknown' ? emptyOverviewFixture() : overviewFixture();
  if (query.get('state') === 'due') Object.assign(snapshot.status.softening, {state:'due', days:-3});
  const panel = document.createElement('nikas-water-treatment-panel');
  panel.hass = {
    locale:{language:'ru'}, user:{is_admin:true}, connection:{connected:true}, states:{},
    callWS:async message => {
      if (message.action) throw new Error('Это предпросмотр, запись недоступна');
      return structuredClone(snapshot);
    },
    callService:async()=>{},
  };
  document.body.append(panel);
  panel.shadowRoot.querySelector('.overview-heading p').textContent = 'Тестовые данные · запись отключена';
</script>
</body>
</html>
