name: Publish HACS release

on:
  push:
    branches: [main]
    paths:
      - custom_components/water_treatment/manifest.json
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-treatment-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm run check

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read manifest version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('custom_components/water_treatment/manifest.json').read_text())['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version):
              raise SystemExit('Invalid manifest version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
          PY
      - name: Publish matching release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            target="$(git rev-list -n 1 "$VERSION")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              # A later main commit may rerun publication of the same version.
              tagged_version="$(git show "$target:custom_components/water_treatment/manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
              [ "$tagged_version" = "$VERSION" ] || { echo "Tag/manifest mismatch"; exit 1; }
            fi
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          sections = text.split('\n## ')
          version = os.environ['VERSION']
          section = next((s for s in sections[1:] if s.splitlines()[0].startswith(version)), None)
          notes = '\n'.join(section.splitlines()[1:]).strip() if section else f'Version {version} from merged main.'
          Path('/tmp/release-notes.md').write_text(notes + '\n')
          PY
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Водоподготовка $VERSION" --notes-file /tmp/release-notes.md "${args[@]}"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
